<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TP test</title>
<style>body{font-family:-apple-system,sans-serif;background:#0f141b;color:#e6e9ee;padding:16px}a{display:block;margin:10px 0;padding:14px;background:#1f7a3d;color:#fff;border-radius:10px;text-decoration:none;font-weight:700}small{color:#9aa4b2;word-break:break-all;display:block;margin-top:4px;font-weight:400}</style></head><body>
<h3>Trucker Path test — hangisi çalıştı? Numarasını Hermes'e yaz.</h3>
<div id="ua" style="font-size:12px;color:#9aa4b2"></div><div id="l"></div>
<script>
const D='32.807468,-97.307931', S='33.425000,-94.047000', P='33.441000,-94.077000';
const V=[
 ['1 · iOS sadece varış (dokümandaki örnek)', `truckerpath://cal_route?daddr=35.353112,-119.040104`],
 ['2 · iOS sadece varış (Fort Worth)', `truckerpath://cal_route?daddr=${D}`],
 ['3 · iOS başlangıç + varış', `truckerpath://cal_route?saddr=${S}&daddr=${D}`],
 ['4 · iOS başlangıç + varış + ara durak', `truckerpath://cal_route?saddr=${S}&daddr=${D}&paddr=${P}`],
 ['5 · iOS varış + ara durak', `truckerpath://cal_route?daddr=${D}&paddr=${P}`],
 ['6 · Android adları (alt çizgili)', `truckerpath://cal_route?d_addr=${D}`],
 ['7 · iOS, virgül kodlu', `truckerpath://cal_route?daddr=${encodeURIComponent(D)}`],
];
document.getElementById('ua').textContent=navigator.userAgent;
document.getElementById('l').innerHTML=V.map(([a,u])=>`<a href="${u}">${a}<small>${u}</small></a>`).join('');
</script></body></html>
